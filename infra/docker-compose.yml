services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: elimuquest
      POSTGRES_USER: elimuquest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the project root .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - elimuquest-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elimuquest -d elimuquest"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  elimuquest-postgres:
